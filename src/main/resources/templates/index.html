<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Overflow Java Analysis</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">📊 Stack Overflow Java Analysis</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="loadStats()">📈 数据统计</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 主内容 -->
<div class="container mt-4">

    <!-- 数据统计卡片 -->
    <div class="row mb-4" id="statsCards">
        <div class="col-md-4">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5 class="card-title">问题数量</h5>
                    <h2 id="questionCount">-</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5 class="card-title">答案数量</h5>
                    <h2 id="answerCount">-</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <h5 class="card-title">评论数量</h5>
                    <h2 id="commentCount">-</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- 标签页导航 -->
    <ul class="nav nav-tabs" id="analysisTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="trends-tab" data-bs-toggle="tab" data-bs-target="#trends" type="button">
                📈 主题趋势
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="cooccurrence-tab" data-bs-toggle="tab" data-bs-target="#cooccurrence" type="button">
                🔗 主题共现
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="multithreading-tab" data-bs-toggle="tab" data-bs-target="#multithreading" type="button">
                🧵 多线程陷阱
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="solvability-tab" data-bs-toggle="tab" data-bs-target="#solvability" type="button">
                ✅ 可解决性分析
            </button>
        </li>
    </ul>

    <!-- 标签页内容 -->
    <div class="tab-content" id="analysisTabContent">

        <!-- 问题1: 主题趋势 -->
        <div class="tab-pane fade show active" id="trends" role="tabpanel">
            <div class="card mt-3">
                <div class="card-header">
                    <h5>📈 Java主题趋势分析</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <label>时间范围（年）:</label>
                            <select id="trendYears" class="form-select" onchange="loadTrends()">
                                <option value="1">1年</option>
                                <option value="2">2年</option>
                                <option value="3" selected>3年</option>
                                <option value="5">5年</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label>选择主题:</label>
                            <select id="trendTopic" class="form-select" onchange="loadSingleTrend()">
                                <option value="all">全部主题</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="trendsChart"></canvas>
                    </div>
                    <div id="trendsTable" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- 问题2: 主题共现 -->
        <div class="tab-pane fade" id="cooccurrence" role="tabpanel">
            <div class="card mt-3">
                <div class="card-header">
                    <h5>🔗 主题共现分析</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <label>显示Top N:</label>
                            <select id="cooccurrenceTopN" class="form-select" onchange="loadCoOccurrence()">
                                <option value="5">Top 5</option>
                                <option value="10" selected>Top 10</option>
                                <option value="15">Top 15</option>
                                <option value="20">Top 20</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="cooccurrenceChart"></canvas>
                    </div>
                    <div id="cooccurrenceTable" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- 问题3: 多线程陷阱 -->
        <div class="tab-pane fade" id="multithreading" role="tabpanel">
            <div class="card mt-3">
                <div class="card-header">
                    <h5>🧵 多线程常见陷阱分析</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <label>显示Top N:</label>
                            <select id="pitfallTopN" class="form-select" onchange="loadPitfalls()">
                                <option value="5">Top 5</option>
                                <option value="10" selected>Top 10</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>陷阱分布（饼图）</h6>
                            <div class="chart-container-small">
                                <canvas id="pitfallPieChart"></canvas>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h6>陷阱频率（柱状图）</h6>
                            <div class="chart-container-small">
                                <canvas id="pitfallBarChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div id="pitfallDetails" class="mt-3"></div>
                </div>
            </div>

            <!-- 异常分布 -->
            <div class="card mt-3">
                <div class="card-header">
                    <h5>⚠️ 多线程异常分布</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="exceptionChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 问题4: 可解决性分析 -->
        <div class="tab-pane fade" id="solvability" role="tabpanel">
            <div class="card mt-3">
                <div class="card-header">
                    <h5>✅ 可解决 vs 难解决问题对比</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>问题数量对比</h6>
                            <div class="chart-container-small">
                                <canvas id="solvabilityPieChart"></canvas>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h6>特征因素对比</h6>
                            <div class="chart-container-small">
                                <canvas id="factorsChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 详细对比 -->
            <div class="card mt-3">
                <div class="card-header">
                    <h5>📊 详细特征对比</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="comparisonChart"></canvas>
                    </div>
                    <div id="solvabilityDetails" class="mt-3"></div>
                </div>
            </div>

            <!-- 时间分布 -->
            <div class="card mt-3">
                <div class="card-header">
                    <h5>🕐 发布时间分布对比</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="timingChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- 页脚 -->
<footer class="footer mt-5 py-3 bg-light">
    <div class="container text-center">
        <span class="text-muted">Stack Overflow Java Q&A Analysis - CS209A Final Project</span>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 自定义脚本 -->
<script src="/js/charts.js"></script>

<script>
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadStats();
        loadTopics();
        loadTrends();

        // 标签页切换时加载对应数据
        document.getElementById('cooccurrence-tab').addEventListener('click', function() {
            setTimeout(loadCoOccurrence, 100);
        });
        document.getElementById('multithreading-tab').addEventListener('click', function() {
            setTimeout(function() {
                loadPitfalls();
                loadExceptions();
            }, 100);
        });
        document.getElementById('solvability-tab').addEventListener('click', function() {
            setTimeout(function() {
                loadSolvability();
                loadTiming();
            }, 100);
        });
    });
</script>

</body>
</html>
